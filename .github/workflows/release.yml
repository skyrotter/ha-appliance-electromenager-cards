name: Release

# Pas de fichier attaché à la release : HACS télécharge alors dist/ directement
# depuis raw.githubusercontent.com au tag de la release.
# (Le lien github.com/.../releases/download/... renvoie un en-tête
# Content-Security-Policy de plus de 8190 octets, que aiohttp refuse :
# « Got more than 8190 bytes », et l'installation via HACS échoue.)
on:
  release:
    types: [published]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: dist/ est à jour et porte la version du tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "const VERSION = \"$v\"" dist/ha-appliance-electromenager-cards.js \
            || { echo "::error::dist/ ne porte pas la version $v : mets à jour src/core/version.js puis node build.js"; exit 1; }
          node build.js --check

  # TEST : sur une pré-release uniquement, attache le .js comme asset pour que HACS
  # compte les téléchargements. Les releases normales restent sans asset (voir en-tête).
  attach-asset-prerelease:
    needs: check
    if: github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Attacher dist/ha-appliance-electromenager-cards.js à la pré-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/ha-appliance-electromenager-cards.js --clobber
