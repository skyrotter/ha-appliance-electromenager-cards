<style>
:root {
  --primary-color:#03a9f4; --error-color:#db4437; --success-color:#43a047; --disabled-text-color:#8a8a8a;
  --primary-text-color:#e6e6e6; --secondary-text-color:#9da3aa; --card-background-color:#1c1f23;
  --page-bg:#111315; --panel-bg:#181b1f; --line:rgba(127,127,127,.22);
}
body.light {
  --primary-text-color:#1d2125; --secondary-text-color:#68707a; --card-background-color:#ffffff;
  --page-bg:#eef0f3; --panel-bg:#f7f8fa;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--page-bg); color:var(--primary-text-color); font:14px/1.45 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position:sticky; top:0; z-index:5; background:var(--page-bg); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
header h1 { font-size:17px; margin:0; font-weight:600; flex:1 1 220px; }
header h1 small { display:block; font-size:12px; font-weight:400; color:var(--secondary-text-color); }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.seg button { background:none; border:0; color:var(--secondary-text-color); padding:6px 11px; font:inherit; cursor:pointer; }
.seg button.on { background:var(--primary-color); color:#fff; }
#q { background:var(--card-background-color); color:var(--primary-text-color); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; width:200px; max-width:100%; }
.cell[hidden] { display:none; }
header a { color:var(--primary-color); text-decoration:none; font-size:13px; }
main { padding:16px; display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(min(100%, 360px), 1fr)); max-width:1600px; margin:0 auto; }
.cell { display:flex; flex-direction:column; gap:10px; }
ha-card { display:block; background:var(--card-background-color); border-radius:12px; border:1px solid var(--line); }
.ctl { background:var(--panel-bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; display:grid; grid-template-columns:auto 1fr auto; gap:6px 10px; align-items:center; font-size:13px; }

.ctl output { font-variant-numeric:tabular-nums; min-width:62px; text-align:right; }
.ctl select, .ctl input[type=range] { width:100%; min-width:0; }

details.yaml { grid-column:1/-1; }

#log { position:fixed; right:16px; bottom:16px; width:min(340px, calc(100vw - 32px)); max-height:180px; overflow:auto; background:var(--panel-bg); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:12px; box-shadow:0 6px 24px rgba(0,0,0,.25); }
#log b { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--secondary-text-color); margin-bottom:4px; }
#log div { padding:2px 0; border-top:1px solid var(--line); font-family:ui-monospace, monospace; }
footer { text-align:center; color:var(--secondary-text-color); font-size:12px; padding:8px 16px 220px; }

<script>
/* Minimal stand-ins for Home Assistant's own elements */
customElements.define('ha-card', class extends HTMLElement {});
customElements.define('ha-icon', class extends HTMLElement {
  static get observedAttributes() { return ['icon']; }
  connectedCallback() { this.render(); }
  attributeChangedCallback() { this.render(); }
  render() {
    const s = getComputedStyle(this).getPropertyValue('--mdc-icon-size').trim() || '24px';
    this.style.display = 'inline-flex'; this.style.width = s; this.style.height = s;
    this.innerHTML = `<iconify-icon icon="${this.getAttribute('icon') || ''}" width="${s}" height="${s}"></iconify-icon>`;
  }
});
</script>
<script src="../dist/ha-appliance-electromenager-cards.js"></script>
<script>
const W = { unit_of_measurement: 'W', device_class: 'power' };
const T = { unit_of_measurement: '°C', device_class: 'temperature' };
const KWH = { unit_of_measurement: 'kWh', device_class: 'energy' };
const EUR = { unit_of_measurement: '€' };
const states = {};
const set = (id, state, attrs) => { states[id] = { entity_id: id, state: String(state), attributes: attrs || states[id]?.attributes || {}, last_changed: new Date().toISOString() }; };
let lang = 'fr', animations = true;
const cards = [];
const log = (msg) => { const d = document.createElement('div'); d.textContent = `${new Date().toLocaleTimeString()} ${msg}`; document.getElementById('log').insertBefore(d, document.getElementById('log').children[1]); };

const hass = () => ({
  states: { ...states }, language: lang, locale: { language: lang }, config: {},
  // historique simulé (pop-up « Climat de la pièce ») : variation jour / nuit autour de la valeur actuelle
  callWS(msg) {
    const s0 = Date.parse(msg.start_time), e0 = Date.parse(msg.end_time), out = {};
    const sim = (id, step) => { const cur = parseFloat(states[id]?.state), hum = /humid/.test(id), pts = [];
      if (!Number.isFinite(cur)) return pts;
      for (let t = s0, k = 0; t < e0; t += step, k++) { const dl = Math.sin(((new Date(t).getHours() - 9) / 24) * 2 * Math.PI);
        pts.push({ t, v: hum ? cur - dl * 5 + Math.sin(k * 0.7) * 2 : cur + dl * 1.3 + Math.sin(k / 40) * 0.6 }); }
      return pts; };
    if (msg.type === 'recorder/statistics_during_period') msg.statistic_ids.forEach((id) => { out[id] = sim(id, 3600e3).map((p) => ({ start: p.t, mean: p.v, min: p.v - 0.4, max: p.v + 0.4 })); });
    else if (msg.type === 'history/history_during_period') msg.entity_ids.forEach((id) => { out[id] = sim(id, 600e3).map((p) => ({ s: p.v.toFixed(1), lu: p.t / 1000 })); });
    return Promise.resolve(out);
  },
  callService(domain, service, data) {
    log(`callService ${domain}.${service} ${data.entity_id}`);
    const cur = states[data.entity_id];
    if (cur && service === 'toggle') { set(data.entity_id, cur.state === 'on' ? 'off' : 'on'); refresh(); }
    if (cur && service === 'select_option') { const at = cur.attributes; set(data.entity_id, data.option); states[data.entity_id].attributes = at; if (cur._input) cur._input.value = data.option; refresh(); }
    // robots : les boutons Démarrer / Pause / Base changent l'état simulé
    const robot = { start: 'cleaning', start_mowing: 'mowing', pause: 'paused', return_to_base: 'returning', dock: 'returning' }[service];
    if (cur && robot && (domain === 'vacuum' || domain === 'lawn_mower')) { set(data.entity_id, robot); if (ROBOT_SEL[data.entity_id]) ROBOT_SEL[data.entity_id].value = robot; refresh(); }
    if (cur && domain === 'cover') simCover(data.entity_id, service, data);
    // lumières : allumer / éteindre, et couleur choisie par la carte
    if (cur && domain === 'light') {
      const at = { ...cur.attributes, ...(data.rgb_color ? { rgb_color: data.rgb_color } : {}) };
      set(data.entity_id, service === 'turn_off' ? 'off' : 'on', at); if (LIGHT_SEL[data.entity_id]) LIGHT_SEL[data.entity_id].value = states[data.entity_id].state; refresh();
    }
    if (cur && domain === 'homeassistant' && service !== 'toggle') { set(data.entity_id, service === 'turn_off' ? 'off' : 'on'); refresh(); }
    if (cur && domain === 'climate') {
      if (service === 'set_hvac_mode') { set(data.entity_id, data.hvac_mode); cur.attributes.hvac_action = data.hvac_mode === 'off' ? 'off' : 'heating'; }
      if (service === 'set_temperature') set(data.entity_id, states[data.entity_id].state, { ...states[data.entity_id].attributes, temperature: data.temperature }); // nouvel objet, comme Home Assistant
      refresh();
    }
  },
});
const refresh = () => { const h = hass(); cards.forEach((c) => (c.hass = h)); };
// portails, barrière, garage : les boutons font bouger la cover simulée (position pas à pas si elle en a une)
const COVER = {}, COVER_SEL = {};
function simCover(id, service, data = {}) {
  const cur = states[id], a = cur.attributes, travel = a._travel || 8;
  clearInterval(COVER[id]); clearTimeout(COVER[id]);
  const done = (st) => { set(id, st); if (COVER_SEL[id]) COVER_SEL[id].value = st; refresh(); };
  if (service === 'stop_cover') { done(a.current_position === 0 ? 'closed' : 'open'); return; }
  if (service === 'set_cover_tilt_position') { a.current_tilt_position = data.tilt_position; refresh(); return; }
  const target = service === 'set_cover_position' ? data.position : service === 'open_cover' ? 100 : 0;
  const up = a.current_position == null ? service === 'open_cover' : target > a.current_position;
  if (a.current_position != null && target === a.current_position) return;
  done(up ? 'opening' : 'closing');
  if (a.current_position == null) { COVER[id] = setTimeout(() => done(up ? 'open' : 'closed'), travel * 1000); return; }
  COVER[id] = setInterval(() => {
    const np = Math.round(a.current_position + (up ? 100 : -100) / travel);
    a.current_position = up ? Math.min(target, np) : Math.max(target, np);
    if (a.current_position === target) { clearInterval(COVER[id]); done(a.current_position ? 'open' : 'closed'); } else refresh();
  }, 1000);
}
const COVER_STATES = [['closed', 'Fermé / Closed'], ['open', 'Ouvert / Open'], ['opening', 'Ouverture / Opening'], ['closing', 'Fermeture / Closing'], ['unavailable', 'Indisponible']];
function cover(ctl, id, travel, withPos, val) {
  const attrs = { supported_features: withPos ? 15 : 11, _travel: travel, ...(withPos ? { current_position: val === 'open' ? 100 : 0 } : {}) };
  COVER_SEL[id] = select(ctl, 'État', id, COVER_STATES, val, (v) => { clearInterval(COVER[id]); clearTimeout(COVER[id]); if (withPos && (v === 'open' || v === 'closed')) states[id].attributes.current_position = v === 'open' ? 100 : 0; });
  states[id].attributes = attrs;
}

/* ---------- control widgets ---------- */
const T_ = (fr, en) => (lang === 'fr' ? fr : en);
function range(ctl, label, id, min, max, step, val, unit, attrs, fmt) {
  set(id, val, attrs);
  const lab = document.createElement('label'); lab.textContent = label;
  const inp = Object.assign(document.createElement('input'), { type: 'range', min, max, step, value: val });
  const out = document.createElement('output');
  const show = () => (out.textContent = fmt ? fmt(+inp.value) : `${inp.value} ${unit}`);
  inp.oninput = () => { set(id, inp.value); show(); refresh(); };
  show(); ctl.append(lab, inp, out);
}
function select(ctl, label, id, options, val, onChange) {
  set(id, val);
  const lab = document.createElement('label'); lab.textContent = label;
  const sel = document.createElement('select');
  options.forEach(([v, t]) => sel.append(new Option(t, v, false, v === val)));
  sel.onchange = () => { set(id, sel.value); onChange && onChange(sel.value); refresh(); };
  ctl.append(lab, sel, document.createElement('span'));
  return sel;
}
function checks(ctl, items) {
  const wrap = document.createElement('div'); wrap.className = 'chk';
  ctl.append(document.createElement('span'), wrap);
  items.forEach(([label, id, val]) => {
    set(id, val ? 'on' : 'off');
    const l = document.createElement('label');
    const c = Object.assign(document.createElement('input'), { type: 'checkbox', checked: !!val });
    c.onchange = () => { set(id, c.checked ? 'on' : 'off'); refresh(); };
    states[id]._input = c;
    l.append(c, label); wrap.append(l);
  });
}
const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

/* ---------- appliance scenarios ---------- */
const CYCLE = [
  ['off', 'Arrêt / Off'], ['Lavage', 'Lavage / Wash'], ['Rinçage', 'Rinçage / Rinse'], ['Essorage', 'Essorage / Spin'],
  ['finished', 'Terminé / Finished'], ['unavailable', 'Indisponible'],
];
const SCEN = [
  { kind: 'washer', title: 'Lave-linge', p: 'washer',
    cfg: { entity: 'sensor.washer_status', power: 'sensor.washer_power', energy: 'sensor.washer_energy', cost: 'sensor.washer_cost', remaining: 'sensor.washer_remaining', door: 'binary_sensor.washer_door' },
    build(ctl) {
      select(ctl, 'État', 'sensor.washer_status', CYCLE, 'Lavage');
      range(ctl, 'Puissance', 'sensor.washer_power', 0, 2400, 10, 1850, 'W', W);
      range(ctl, 'Restant', 'sensor.washer_remaining', 0, 180, 1, 47, 'min', { unit_of_measurement: 'min' });
      set('sensor.washer_energy', 1.42, KWH); set('sensor.washer_cost', 0.31, EUR);
      checks(ctl, [['Porte ouverte', 'binary_sensor.washer_door', false]]);
    } },
  { kind: 'dryer', title: 'Sèche-linge',
    cfg: { entity: 'sensor.dryer_status', power: 'sensor.dryer_power', energy: 'sensor.dryer_energy', remaining: 'sensor.dryer_remaining' },
    build(ctl) {
      select(ctl, 'État', 'sensor.dryer_status', [['off', 'Arrêt'], ['Séchage', 'Séchage / Dry'], ['Refroidissement', 'Refroidissement / Cool'], ['finished', 'Terminé'], ['unavailable', 'Indisponible']], 'Séchage');
      range(ctl, 'Puissance', 'sensor.dryer_power', 0, 2800, 10, 2300, 'W', W);
      range(ctl, 'Restant', 'sensor.dryer_remaining', 0, 180, 1, 64, 'min', { unit_of_measurement: 'min' });
      set('sensor.dryer_energy', 2.1, KWH);
    } },
  { kind: 'dishwasher', title: 'Lave-vaisselle',
    cfg: { entity: 'sensor.dishwasher_status', power: 'sensor.dishwasher_power', remaining: 'sensor.dishwasher_remaining', progress: 'sensor.dishwasher_progress' },
    build(ctl) {
      select(ctl, 'État', 'sensor.dishwasher_status', [['off', 'Arrêt'], ['Lavage', 'Lavage / Wash'], ['Rinçage', 'Rinçage / Rinse'], ['Séchage', 'Séchage / Dry'], ['finished', 'Terminé'], ['unavailable', 'Indisponible']], 'Lavage');
      range(ctl, 'Puissance', 'sensor.dishwasher_power', 0, 2200, 10, 1900, 'W', W);
      range(ctl, 'Restant', 'sensor.dishwasher_remaining', 0, 240, 1, 72, 'min', { unit_of_measurement: 'min' });
      range(ctl, 'Progression', 'sensor.dishwasher_progress', 0, 100, 1, 35, '%', { unit_of_measurement: '%' });
    } },
  { kind: 'water-heater', title: "Ballon d'eau chaude",
    cfg: { switch: 'switch.water_heater', power: 'sensor.water_heater_power', temperature: 'sensor.water_heater_temp', target_temperature: 'sensor.water_heater_target', cost: 'sensor.water_heater_cost' },
    build(ctl) {
      set('switch.water_heater', 'on');
      range(ctl, 'Puissance', 'sensor.water_heater_power', 0, 3000, 50, 2400, 'W', W);
      range(ctl, 'Température', 'sensor.water_heater_temp', 10, 80, 1, 48, '°C', T);
      range(ctl, 'Consigne', 'sensor.water_heater_target', 40, 75, 1, 60, '°C', T);
      set('sensor.water_heater_cost', 0.34, EUR);
      ctl.append(Object.assign(document.createElement('span'), { textContent: '' }), Object.assign(document.createElement('span'), { textContent: 'Bouton ⏻ de la carte = interrupteur', style: 'color:var(--secondary-text-color);font-size:12px' }), document.createElement('span'));
    } },
  { kind: 'oven', title: 'Four',
    cfg: { switch: 'switch.oven', power: 'sensor.oven_power', temperature: 'sensor.oven_temp', target_temperature: 'sensor.oven_target', door: 'binary_sensor.oven_door' },
    build(ctl) {
      set('switch.oven', 'on');
      range(ctl, 'Puissance', 'sensor.oven_power', 0, 3500, 50, 2600, 'W', W);
      range(ctl, 'Température', 'sensor.oven_temp', 20, 250, 1, 140, '°C', T);
      range(ctl, 'Consigne', 'sensor.oven_target', 50, 250, 5, 180, '°C', T);
      checks(ctl, [['Porte ouverte', 'binary_sensor.oven_door', false]]);
    } },
  { kind: 'microwave', title: 'Micro-ondes',
    cfg: { power: 'sensor.microwave_power', remaining: 'sensor.microwave_remaining', door: 'binary_sensor.microwave_door' },
    build(ctl) {
      range(ctl, 'Puissance', 'sensor.microwave_power', 0, 1200, 10, 900, 'W', W);
      range(ctl, 'Restant', 'sensor.microwave_remaining', 0, 600, 5, 105, 's', { unit_of_measurement: 's' }, mmss);
      checks(ctl, [['Porte ouverte', 'binary_sensor.microwave_door', false]]);
    } },
  { kind: 'air-fryer', title: 'Airfryer',
    cfg: { entity: 'switch.airfryer', power: 'sensor.airfryer_power', remaining: 'sensor.airfryer_remaining', energy: 'sensor.airfryer_energy', cost: 'sensor.airfryer_cost' },
    build(ctl) {
      set('switch.airfryer', 'on');
      range(ctl, 'Puissance', 'sensor.airfryer_power', 0, 2400, 10, 1650, 'W', W);
      range(ctl, 'Restant', 'sensor.airfryer_remaining', 0, 1800, 15, 720, 's', { unit_of_measurement: 's' }, mmss);
      set('sensor.airfryer_energy', 0.42, KWH);
      set('sensor.airfryer_cost', 0.09, { unit_of_measurement: '€', device_class: 'monetary' });
    } },
  { kind: 'coffee-maker', title: 'Cafetière (filtre)',
    cfg: { entity: 'switch.coffee', power: 'sensor.coffee_power', energy: 'sensor.coffee_energy', style: 'filtre' },
    build(ctl) {
      set('switch.coffee', 'on');
      range(ctl, 'Puissance', 'sensor.coffee_power', 0, 1500, 10, 950, 'W', W);
      set('sensor.coffee_energy', 0.18, KWH);
    } },
  { kind: 'coffee-maker', title: 'Cafetière (dosettes)',
    cfg: { power: 'sensor.pod_power', style: 'dosette' },
    build(ctl) { range(ctl, 'Puissance', 'sensor.pod_power', 0, 1500, 10, 1400, 'W', W); } },
  { kind: 'coffee-maker', title: 'Cafetière (expresso)',
    cfg: { power: 'sensor.espresso_power', style: 'expresso' },
    build(ctl) { range(ctl, 'Puissance', 'sensor.espresso_power', 0, 1500, 10, 1300, 'W', W); } },
  { kind: 'tv', title: 'Téléviseur',
    cfg: { entity: 'switch.tv', power: 'sensor.tv_power', energy: 'sensor.tv_energy' },
    build(ctl) {
      set('switch.tv', 'on');
      range(ctl, 'Puissance', 'sensor.tv_power', 0, 200, 0.5, 90, 'W', W);
      set('sensor.tv_energy', 0.35, KWH);
    } },
  { kind: 'ps5', title: 'PlayStation 5',
    cfg: { entity: 'media_player.ps5', switch: 'switch.ps5', power: 'sensor.ps5_power', energy: 'sensor.ps5_energy' },
    build(ctl) {
      set('switch.ps5', 'on');
      range(ctl, 'Puissance', 'sensor.ps5_power', 0, 250, 0.5, 60, 'W', W);
      select(ctl, 'PlayStation Network', 'media_player.ps5', [['playing', 'En jeu / Playing'], ['on', 'En ligne / Online'], ['off', 'Hors ligne / Offline']], 'on');
      set('media_player.ps5', 'on', { media_title: 'Astro Bot' });
      set('sensor.ps5_energy', 0.4, KWH);
    } },
  { kind: 'range-hood', title: 'Hotte aspirante',
    cfg: { power: 'sensor.hood_power', energy: 'sensor.hood_energy' },
    build(ctl) {
      range(ctl, 'Puissance', 'sensor.hood_power', 0, 300, 1, 80, 'W', W);
      set('sensor.hood_energy', 0.12, KWH);
    } },
  { kind: 'towel-dryer', title: 'Sèche-serviettes',
    cfg: { switch: 'switch.towel', power: 'sensor.towel_power', mode: 'select.towel_mode', temperature: 'sensor.bathroom_temp', target_temperature: 'sensor.towel_target', energy: 'sensor.towel_energy' },
    build(ctl) {
      set('switch.towel', 'on');
      select(ctl, 'Mode', 'select.towel_mode', [['confort', 'Confort'], ['eco', 'Éco'], ['hors-gel', 'Hors-gel'], ['arret', 'Arrêt']], 'confort');
      states['select.towel_mode'].attributes = { options: ['Confort', 'Eco', 'Hors-gel', 'Arrêt'] };
      range(ctl, 'Puissance', 'sensor.towel_power', 0, 1000, 10, 500, 'W', W);
      range(ctl, 'Salle de bain', 'sensor.bathroom_temp', 10, 30, 0.5, 20, '°C', T);
      range(ctl, 'Consigne', 'sensor.towel_target', 15, 30, 0.5, 22, '°C', T);
      set('sensor.towel_energy', 1.2, KWH);
    } },
  { kind: 'server-rack', title: 'Baie informatique (homelab)',
    cfg: { switch: 'switch.rack', power: 'sensor.rack_power', temperature: 'sensor.rack_temp', energy: 'sensor.rack_energy', max_power: 300 },
    build(ctl) {
      set('switch.rack', 'on');
      range(ctl, 'Puissance', 'sensor.rack_power', 0, 400, 1, 145, 'W', W);
      range(ctl, 'Température', 'sensor.rack_temp', 15, 50, 0.5, 29, '°C', T);
      set('sensor.rack_energy', 3.5, KWH);
    } },
  { kind: 'desktop-pc', title: 'PC fixe',
    cfg: { switch: 'switch.pc', power: 'sensor.pc_power', energy: 'sensor.pc_energy' },
    build(ctl) {
      set('switch.pc', 'on');
      range(ctl, 'Puissance', 'sensor.pc_power', 0, 500, 0.5, 120, 'W', W);

  { kind: 'laptop', title: 'PC portable',
    cfg: { switch: 'switch.laptop', power: 'sensor.laptop_power', energy: 'sensor.laptop_energy' },

// volets : cover positionnable (et inclinable pour le store vénitien), moteur, soleil jour / nuit
function shutterCtl(ctl, id, pw, travel, pos, tilt) {
  cover(ctl, id, travel, true, pos > 0 ? 'open' : 'closed');
  Object.assign(states[id].attributes, { current_position: pos, supported_features: tilt == null ? 15 : 255 }, tilt == null ? {} : { current_tilt_position: tilt });
  select(ctl, 'Soleil', 'sun.sun', [['above_horizon', 'Jour / Day'], ['below_horizon', 'Nuit / Night']], 'above_horizon');
  range(ctl, 'Puissance moteur', pw, 0, 300, 1, 0, 'W', W);
}
// lumières : état, luminosité et couleur simulés
function lightCtl(ctl, id, pw, attrs) {
  set(id, 'on', { ...attrs });
  LIGHT_SEL[id] = select(ctl, 'État', id, [['on', 'Allumée / On'], ['off', 'Éteinte / Off']], 'on');
  states[id].attributes = { ...attrs };
  const lab = document.createElement('label'); lab.textContent = 'Luminosité';
  const inp = Object.assign(document.createElement('input'), { type: 'range', min: 10, max: 255, value: attrs.brightness || 255 });
  inp.oninput = () => { states[id].attributes.brightness = +inp.value; refresh(); };
  const lab2 = document.createElement('label'); lab2.textContent = 'Couleur';
  const col = Object.assign(document.createElement('input'), { type: 'color', value: '#ffc46b' });
  col.oninput = () => { const v = col.value; states[id].attributes.rgb_color = [1, 3, 5].map((i) => parseInt(v.slice(i, i + 2), 16)); delete states[id].attributes.color_temp_kelvin; refresh(); };
  ctl.append(lab, inp, document.createElement('span'), lab2, col, document.createElement('span'));
  set(pw, 8.5, W);
}

// les cartes autonomes prennent leur langue dans l'option `language`, pas dans Home Assistant
const scenCfg = (s) => ({ ...s.cfg, ...(s.lang ? { language: lang } : {}), ...(animations ? {} : { animations: false }) });
const toYaml = (kind, cfg) => [`type: custom:appliance-${kind}-card`, ...Object.entries(cfg).map(([k, v]) => `${k}: ${v}`)].join('\n');

// recherche : sans accents ni majuscules, sur le titre, le type de carte, le nom et le modèle
const norm = (t) => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function filterCards() {
  const q = norm(document.getElementById('q').value).trim().split(/\s+/).filter(Boolean);
  document.querySelectorAll('#main .cell').forEach((c) => { c.hidden = !q.every((w) => c.dataset.search.includes(w)); });
}
document.getElementById('q').addEventListener('input', filterCards);

function buildAll() {
  const main = document.getElementById('main');
  main.innerHTML = ''; cards.length = 0;
  for (const s of SCEN) {
    const cell = document.createElement('div'); cell.className = 'cell';
    const ctl = document.createElement('div'); ctl.className = 'ctl';
    ctl.innerHTML = `<h3>${s.title} — commandes simulées</h3>`;
    s.build(ctl);
    const cfg = scenCfg(s);
    const yaml = document.createElement('details'); yaml.className = 'yaml';
    yaml.innerHTML = `<summary>Voir le YAML</summary><pre>${toYaml(s.kind, cfg)}</pre>`;
    ctl.append(yaml);
    const el = document.createElement(`appliance-${s.kind}-card`);
    el.setConfig(cfg); el._scen = s;
    el.addEventListener('hass-more-info', (e) => log(`more-info ${e.detail.entityId}`));
    cards.push(el);
    cell.dataset.search = norm(`${s.title} ${s.kind} ${s.kind.replace(/-/g, ' ')} ${s.cfg.name || ''} ${s.cfg.model || ''}`);
    cell.append(el, ctl); main.append(cell);
  }
  filterCards();
  refresh();
}

function seg(id, cb) {
  const root = document.getElementById(id);
  root.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    root.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    cb(b.dataset.v);
  });
}
// Langues disponibles = fichiers src/i18n/<lang>.json, lus dans l'option `language` de l'éditeur d'une carte autonome
const LANGS = (() => {
  const form = customElements.get('appliance-linky-card')?.getConfigForm?.();
  const opt = form && form.schema.find((i) => i.name === 'language');
  return opt ? opt.selector.select.options.map((o) => o.value || o) : ['fr', 'en'];
})();
const langName = (l) => { try { return new Intl.DisplayNames([l], { type: 'language' }).of(l); } catch (e) { return l; } };
LANGS.forEach((l) => {
  const b = Object.assign(document.createElement('button'), { textContent: l.toUpperCase(), title: langName(l), className: l === lang ? 'on' : '' });
  b.dataset.v = l; document.getElementById('lang').append(b);
});
seg('theme', (v) => document.body.classList.toggle('light', v === 'light'));
seg('lang', (v) => { lang = v; document.documentElement.lang = v; cards.forEach((el) => el._scen.lang && el.setConfig(scenCfg(el._scen))); refresh(); });
seg('anim', (v) => { animations = v === '1'; buildAll(); });
buildAll();
const ver = window.customCards ? `${window.customCards.length} cartes chargées` : 'erreur de chargement';
document.getElementById('ver').textContent += ` · ${ver}`;
</script>
