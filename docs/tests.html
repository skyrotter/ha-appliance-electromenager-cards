<div id="g"></div>
<script>
customElements.define('ha-card', class extends HTMLElement{});
customElements.define('ha-icon', class extends HTMLElement{});
window.__errors=[]; window.addEventListener('error',e=>__errors.push(e.message));
</script>
<script src="../dist/ha-appliance-electromenager-cards.js"></script>
<script>
const R=[]; const ok=(name,cond,info='')=>R.push({name,pass:!!cond,info:cond?'':String(info)});
const now=new Date().toISOString();
const mk=(id,state,attrs={})=>({entity_id:id,state:String(state),attributes:attrs,last_changed:now});
const W={unit_of_measurement:'W',device_class:'power'}, T={unit_of_measurement:'°C',device_class:'temperature'};
function hassOf(states,lang='fr'){const S={};states.forEach(s=>S[s.entity_id]=s);return{states:S,language:lang,locale:{language:lang},config:{},calls:[],callService(d,s,data){this.calls.push([d,s,data]);}};}
function card(kind,cfg,states,lang){const el=document.createElement(`appliance-${kind}-card`);el.setConfig(cfg);document.getElementById('g').appendChild(el);const h=hassOf(states,lang);el.hass=h;return {el,h,sr:el.shadowRoot,wrap:el.shadowRoot.getElementById('wrap'),txt:()=>el.shadowRoot.getElementById('info').textContent.replace(/\s+/g,' ').trim(),lcd:()=>el.shadowRoot.querySelector('.lcd')?.textContent};}
const has=(c,cls)=>c.wrap.classList.contains(cls);

// registration
const tags=['thermomix','cookeo','washer','dryer','dishwasher','water-heater','oven','microwave','fridge','pellet-stove','pool-pump','printer-3d','chest-freezer','drawer-freezer','solar','vmc','hob','radiator','air-fryer','coffee-maker','tv','range-hood','ac-split','heat-pump','towel-dryer','server-rack','desktop-pc','laptop','wine-cooler','beer-tap','av-receiver','smart-speaker','fan','generic','tool-charger','ceiling-fan','dehumidifier','air-purifier','monitor','kettle','toaster','power-strip','phone-charger','piano','garland','wet-vacuum','ps5','smart-plug','dosing-pump','printer','elliptical','exercise-bike','rowing-machine'];
tags.forEach(t=>ok(`registered ${t}`,customElements.get(`appliance-${t}-card`)));
// card picker: every core card and every self-contained card listed exactly once
const solo=['aquarium','linky','battery','ev-charger','robot-vacuum-solo','robot-mower-solo','pellet-boiler','gas-boiler','water-heat-pump','diesel-heater','jacuzzi','barrier','sliding-gate','swing-gate','garage-door','sauna','water-pump','industrial-pump','pool-robot','sump-pump','ups','underfloor-heating','light-bulb','color-bulb','filament-bulb','pendant-light','pendant-cluster','desk-lamp','floor-lamp','chandelier','garden-spotlight','christmas-tree','ceiling-spot','roller-shutter','sliding-curtain','venetian-blind','swing-shutter','pergola','roof-window','awning','water-meter','gas-meter','electric-meter','trv','room-climate','mailbox','smoke-detector','leak-detector','mini-pc','nas','tv-box','scale','smart-lock','cat-flap','pet-fountain','thermo-heater','smart-tap','water-valve','water-softener','rain-gauge','plant-monitor','humidifier','fan-heater','inflatable-spa'];
solo.forEach(t=>ok(`registered ${t}`,customElements.get(`appliance-${t}-card`)));
const picked=window.customCards.map(c=>c.type), wanted=[...tags,...solo].map(t=>`appliance-${t}-card`).concat('appliance-card'); // + the single card (picker.js)
ok(`customCards = ${wanted.length}`,picked.length===wanted.length&&wanted.every(t=>picked.filter(p=>p===t).length===1),
  [...wanted.filter(t=>!picked.includes(t)).map(t=>`missing ${t}`),...picked.filter(t=>!wanted.includes(t)).map(t=>`extra ${t}`),`${picked.length} entries`].join(', '));
{const np=window.customCards.filter(c=>c.type.startsWith('appliance-')&&!c.name.startsWith('Appliance – ')).map(c=>c.name); ok('picker names start with Appliance –',!np.length,np.join(', '));}
// config validation
try{document.createElement('appliance-washer-card').setConfig({});ok('empty config throws',false)}catch(e){ok('empty config throws',/entity|power/.test(e.message),e.message)}

// washer state matrix
const wcases=[
 ['input_boolean off -> idle',{entity:'input_boolean.w'},[mk('input_boolean.w','off')],'st-idle','OFF'],
 ['input_boolean on -> running/wash',{entity:'input_boolean.w'},[mk('input_boolean.w','on')],'ph-wash','WASH'],
 ['plug on + low power -> standby',{entity:'switch.w',power:'sensor.p'},[mk('switch.w','on'),mk('sensor.p',2,W)],'st-standby','OFF'],
 ['plug on + high power -> running (heating phase from power)',{entity:'switch.w',power:'sensor.p'},[mk('switch.w','on'),mk('sensor.p',1500,W)],'st-running','HEAT'],
 ['plug off -> off',{entity:'switch.w',power:'sensor.p'},[mk('switch.w','off'),mk('sensor.p',0,W)],'st-off','OFF'],
 ['power only 0 -> idle',{power:'sensor.p'},[mk('sensor.p',0,W)],'st-idle','OFF'],
 ['power kW unit -> running (1.2 kW = heating phase)',{power:'sensor.p'},[mk('sensor.p',1.2,{unit_of_measurement:'kW',device_class:'power'})],'st-running','HEAT'],
 ['sensor Rinçage -> rinse',{entity:'sensor.s'},[mk('sensor.s','Rinçage')],'ph-rinse','RINSE'],
 ['sensor spin -> spin',{entity:'sensor.s'},[mk('sensor.s','spin')],'ph-spin','SPIN'],
 ['program Essorage -> spin',{entity:'sensor.s',program:'sensor.prog'},[mk('sensor.s','running'),mk('sensor.prog','Essorage 1200')],'ph-spin','SPIN'],
 ['finished -> END',{entity:'sensor.s'},[mk('sensor.s','finished')],'st-finished','END'],
 ['finished but power high -> running (900 W = spin phase)',{entity:'sensor.s',power:'sensor.p'},[mk('sensor.s','finished'),mk('sensor.p',900,W)],'st-running','SPIN'],
 ['unavailable -> st-unavailable',{entity:'sensor.s'},[mk('sensor.s','unavailable')],'st-unavailable','- - -'],
 ['missing entity -> unavailable',{entity:'sensor.nope'},[],'st-unavailable','- - -'],['power sensor unavailable -> unavailable',{power:'sensor.p'},[mk('sensor.p','unavailable')],'st-unavailable','- - -'],
];
for(const [n,cfg,st,cls,l] of wcases){try{const c=card('washer',cfg,st);if(cls)ok(`washer: ${n}`,has(c,cls),c.wrap.className);if(l)ok(`washer LCD: ${n}`,c.lcd()===l,c.lcd());if(!cls)ok(`washer: ${n}`,true)}catch(e){ok(`washer: ${n}`,false,e.message)}}

// remaining formats
const rcases=[['47 min',[mk('sensor.r',47,{unit_of_measurement:'min'})],'0:47','47 min'],['H:MM:SS',[mk('sensor.r','1:05:00')],'1:05','1 h 05'],['seconds',[mk('sensor.r',90,{unit_of_measurement:'s'})],'0:02','2 min'],
 ['timestamp',[mk('sensor.r',new Date(Date.now()+30*60000).toISOString(),{device_class:'timestamp'})],'0:30','30 min'],['hours',[mk('sensor.r',2,{unit_of_measurement:'h'})],'2:00','2 h']];
for(const [n,st,l,tile] of rcases){const c=card('washer',{entity:'input_boolean.w',remaining:'sensor.r'},[mk('input_boolean.w','on'),...st]);
 ok(`remaining ${n} LCD`,c.lcd()===l,c.lcd()); ok(`remaining ${n} tile`,c.sr.getElementById('stats').textContent.includes(tile),c.sr.getElementById('stats').textContent); ok(`remaining ${n} ends_at`,/Fin à/.test(c.txt()),c.txt());}

// dryer / dishwasher
let c=card('dryer',{entity:'binary_sensor.d'},[mk('binary_sensor.d','on')]); ok('dryer on -> ph-dry + DRY',has(c,'ph-dry')&&c.lcd()==='DRY',c.wrap.className+' '+c.lcd());
c=card('dryer',{entity:'sensor.d'},[mk('sensor.d','Refroidissement')]); ok('dryer cooling phase',has(c,'ph-cool'),c.wrap.className);
c=card('dishwasher',{entity:'sensor.d'},[mk('sensor.d','Séchage')]); ok('dishwasher drying phase',has(c,'ph-dry'),c.wrap.className);
c=card('dishwasher',{entity:'sensor.d'},[mk('sensor.d','running')]); ok('dishwasher wash phase',has(c,'ph-wash'),c.wrap.className);
// Home Connect: raw program keys start with "laundry_" (contains "dry"), the washer must stay in the wash phase
c=card('washer',{entity:'sensor.s',program:'select.p'},[mk('sensor.s','run'),mk('select.p','laundry_care_washer_program_cotton')]); ok('washer Home Connect key -> wash, not dry',has(c,'ph-wash')&&c.lcd()==='WASH',c.wrap.className+' '+c.lcd());
c=card('washer',{entity:'sensor.s'},[mk('sensor.s','Drying')]); ok('washer Drying -> dry',has(c,'ph-dry'),c.wrap.className);
c=card('washer',{entity:'sensor.s',program:'select.p'},[mk('sensor.s','run'),mk('select.p','wash_and_dry_60')]); ok('washer program wash_and_dry -> dry',has(c,'ph-dry'),c.wrap.className);

// water heater
c=card('water-heater',{switch:'switch.h',power:'sensor.p',temperature:'sensor.t',target_temperature:'sensor.c'},[mk('switch.h','on'),mk('sensor.p',2400,W),mk('sensor.t',45,T),mk('sensor.c',60,T)]);
ok('water heater heating',has(c,'st-heating'),c.wrap.className);
ok('water heater needle rotated',/rotate\(/.test(c.sr.querySelector('.needle').getAttribute('transform')||''));
ok('water heater gauge text 45°',c.sr.querySelector('.gauge-txt').textContent==='45°',c.sr.querySelector('.gauge-txt').textContent);
ok('water heater progress bar visible',c.sr.getElementById('bar').style.display!=='none');
c=card('water-heater',{switch:'switch.h',power:'sensor.p'},[mk('switch.h','on'),mk('sensor.p',0,W)]); ok('water heater ready',has(c,'st-ready'),c.wrap.className);
c=card('water-heater',{switch:'switch.h'},[mk('switch.h','off')]); ok('water heater off',has(c,'st-off'),c.wrap.className);
c=card('water-heater',{entity:'water_heater.x'},[mk('water_heater.x','eco',{current_temperature:55,temperature:60})]); ok('water_heater entity attrs used',c.sr.querySelector('.gauge-txt').textContent==='55°',c.sr.querySelector('.gauge-txt').textContent);

// oven
c=card('oven',{switch:'switch.o',power:'sensor.p',temperature:'sensor.t',target_temperature:'sensor.c'},[mk('switch.o','on'),mk('sensor.p',2500,W),mk('sensor.t',120,T),mk('sensor.c',200,T)]);
ok('oven preheating',has(c,'st-preheating'),c.wrap.className); ok('oven LCD temp',c.lcd()==='120°',c.lcd());
c=card('oven',{switch:'switch.o',power:'sensor.p',temperature:'sensor.t',target_temperature:'sensor.c'},[mk('switch.o','on'),mk('sensor.p',2500,W),mk('sensor.t',198,T),mk('sensor.c',200,T)]);
ok('oven heating at temp',has(c,'st-heating'),c.wrap.className);
c=card('oven',{power:'sensor.p'},[mk('sensor.p',0,W)]); ok('oven off shows clock',/\d{1,2}:\d{2}/.test(c.lcd()),c.lcd());

// microwave
c=card('microwave',{power:'sensor.p',remaining:'sensor.r'},[mk('sensor.p',900,W),mk('sensor.r','0:01:45')]); ok('microwave running countdown',has(c,'active')&&c.lcd()==='1:45',c.lcd());
c=card('microwave',{power:'sensor.p',door:'binary_sensor.d'},[mk('sensor.p',0,W),mk('binary_sensor.d','on')]); ok('microwave door alert',has(c,'alert')&&/Porte ouverte/.test(c.txt()),c.txt());

// air fryer
c=card('air-fryer',{power:'sensor.p',remaining:'sensor.r'},[mk('sensor.p',1700,W),mk('sensor.r','0:12:00')]); ok('air fryer cooking countdown',has(c,'st-cooking')&&has(c,'active')&&c.lcd()==='12:00',c.wrap.className+' '+c.lcd());
ok('air fryer status text Cuisson',/Cuisson/.test(c.txt()),c.txt());
c=card('air-fryer',{power:'sensor.p',temperature:'sensor.t'},[mk('sensor.p',1500,W),mk('sensor.t',200,T)]); ok('air fryer LCD temp',c.lcd()==='200°',c.lcd());
c=card('air-fryer',{entity:'switch.af',power:'sensor.p'},[mk('switch.af','on'),mk('sensor.p',2,W)]); ok('air fryer plug on low power -> idle',has(c,'st-idle')&&c.lcd()==='OFF',c.wrap.className+' '+c.lcd());
c=card('air-fryer',{entity:'switch.af',power:'sensor.p'},[mk('switch.af','off'),mk('sensor.p',0,W)]); ok('air fryer off',has(c,'st-off'),c.wrap.className);
c=card('air-fryer',{entity:'sensor.s'},[mk('sensor.s','finished')]); ok('air fryer finished End',has(c,'st-finished')&&c.lcd()==='End',c.lcd());

// coffee maker
c=card('coffee-maker',{entity:'switch.cf',power:'sensor.p'},[mk('switch.cf','on'),mk('sensor.p',950,W)]); ok('coffee brewing',has(c,'st-brewing')&&has(c,'active')&&c.lcd()==='CAFE',c.wrap.className+' '+c.lcd());
ok('coffee status text',/Préparation du café/.test(c.txt()),c.txt());
c=card('coffee-maker',{entity:'switch.cf',power:'sensor.p'},[mk('switch.cf','on'),mk('sensor.p',70,W)]); ok('coffee filtre keep warm',has(c,'st-keep_warm')&&/Maintien au chaud/.test(c.txt()),c.wrap.className);
c=card('coffee-maker',{entity:'switch.cf',power:'sensor.p',style:'dosette'},[mk('switch.cf','on'),mk('sensor.p',70,W)]); ok('coffee pod ready',has(c,'st-ready')&&c.sr.querySelector('.s-dosette'),c.wrap.className);
c=card('coffee-maker',{power:'sensor.p',style:'espresso'},[mk('sensor.p',1,W)]); ok('coffee espresso idle + svg',has(c,'st-idle')&&c.sr.querySelector('.s-expresso'),c.wrap.className);
c=card('coffee-maker',{entity:'switch.cf',power:'sensor.p'},[mk('switch.cf','off'),mk('sensor.p',0,W)]); ok('coffee off',has(c,'st-off')&&c.lcd()==='OFF',c.wrap.className+' '+c.lcd());
// Thermomix : états depuis la prise, modèle TM6 / TM7, chauffe / cuisson, bouton marche/arrêt, cases énergie / coût
// Cookeo : statut lu depuis la prise ; photo par défaut, dessin avec style: drawing
{const ck=(w,cfg={},sw='on')=>card('cookeo',{power:'sensor.p',switch:'switch.k',...cfg},[mk('sensor.p',w,W),mk('switch.k',sw),mk('sensor.t',98,T),mk('sensor.r',12,{unit_of_measurement:'min'}),mk('sensor.pg','Risotto')]);
 let c=ck(0,{},'off'); ok('cookeo off (plug off)',has(c,'st-off')&&/Éteint/.test(c.txt()),c.wrap.className);
 c=ck(0.2); ok('cookeo off below standby_threshold',has(c,'st-off'),c.wrap.className);
 c=ck(3); ok('cookeo standby (screen on)',has(c,'st-standby')&&!has(c,'active'),c.wrap.className);
 c=ck(40); ok('cookeo keep warm',has(c,'st-keep_warm')&&has(c,'active'),c.wrap.className);
 c=ck(900); ok('cookeo heating',has(c,'st-heating')&&has(c,'active'),c.wrap.className);
 // cuisson sous pression : la résistance se coupe puis se rallume pour tenir la pression
 const S=(w)=>{const h={...c.h,states:{...c.h.states,'sensor.p':mk('sensor.p',w,W)}};c.el.hass=h;};
 S(4); ok('cookeo cooking (element off after heating)',has(c,'st-cooking')&&/Cuisson/.test(c.txt()),c.wrap.className);
 S(950); ok('cookeo cooking (element back on)',has(c,'st-cooking'),c.wrap.className);
 c=ck(700,{heat_threshold:800}); ok('cookeo heat_threshold option',has(c,'st-keep_warm'),c.wrap.className);
 c=ck(3); ok('cookeo photo by default',!!c.sr.querySelector('.cko.s-photo image'));
 c=ck(3,{style:'drawing'}); ok('cookeo drawing style',!!c.sr.querySelector('.cko.s-drawing')&&!c.sr.querySelector('.cko image'));
 c=ck(900,{temperature:'sensor.t',remaining:'sensor.r',program:'sensor.pg'}); const all=c.sr.textContent.replace(/\s+/g,' '); ok('cookeo temperature, remaining and program',/98\s*°C/.test(all)&&/12\s*min/.test(all)&&/Risotto/.test(c.txt()),all.slice(0,200));
 c=ck(900); c.sr.querySelector('.toggle').click(); ok('cookeo: cut while heating needs 2 clicks',c.h.calls.length===0);
 c=ck(3); c.sr.querySelector('.toggle').click(); ok('cookeo: standby cut in one click',c.h.calls.length===1);}
{const tm=(w,cfg={},sw='on')=>card('thermomix',{power:'sensor.p',switch:'switch.t',energy:'sensor.e',cost:'sensor.c',...cfg},[mk('sensor.p',w,W),mk('switch.t',sw),mk('sensor.e',0.4,{unit_of_measurement:'kWh',device_class:'energy'}),mk('sensor.c',0.1,{unit_of_measurement:'€'})]);
 let c=tm(0,{},'off'); ok('thermomix off (plug off)',has(c,'st-off')&&/Éteint/.test(c.txt()),c.wrap.className);
 c=tm(0.2); ok('thermomix off below standby_threshold',has(c,'st-off'),c.wrap.className);
 c=tm(3); ok('thermomix standby',has(c,'st-standby')&&!has(c,'active'),c.wrap.className);
 c=tm(60); ok('thermomix mixing',has(c,'st-mixing')&&has(c,'active')&&/Mixage/.test(c.txt()),c.wrap.className);
 c=tm(400); ok('thermomix turbo',has(c,'st-turbo')&&/Turbo/.test(c.txt()),c.wrap.className);
 c=tm(900); ok('thermomix heating',has(c,'st-heating')&&/chauffe/i.test(c.txt()),c.wrap.className);
 // cuisson : la résistance se coupe (puissance du moteur seul) juste après avoir chauffé, puis se rallume
 const S=(w)=>{const h={...c.h,states:{...c.h.states,'sensor.p':mk('sensor.p',w,W)}};c.el.hass=h;};
 S(60); ok('thermomix cooking (element off after heating)',has(c,'st-cooking')&&/Cuisson/.test(c.txt()),c.wrap.className);
 S(950); ok('thermomix cooking (element back on)',has(c,'st-cooking'),c.wrap.className);
 S(3); ok('thermomix back to standby',has(c,'st-standby'),c.wrap.className);
 S(60); ok('thermomix mixing after standby (no cooking)',has(c,'st-mixing'),c.wrap.className);
 c=tm(60,{threshold:100}); ok('thermomix threshold option',has(c,'st-standby'),c.wrap.className);
 c=tm(700,{heat_threshold:800}); ok('thermomix heat_threshold option',has(c,'st-turbo'),c.wrap.className);
 c=tm(3); ok('thermomix tm6 by default',!!c.sr.querySelector('.tmx.m-tm6 image'));
 c=tm(3,{model:'tm7'}); ok('thermomix tm7 model',!!c.sr.querySelector('.tmx.m-tm7 image'));
 c=tm(3); ok('thermomix tiles power/energy/cost + toggle',c.sr.querySelectorAll('#stats .tile').length>=3&&!!c.sr.querySelector('.toggle'),c.sr.querySelectorAll('#stats .tile').length);
 c=tm(3,{show_energy:false,show_cost:false,show_power:false,show_toggle:false}); ok('thermomix checkboxes hide tiles + toggle',c.sr.querySelectorAll('#stats .tile').length===0&&!c.sr.querySelector('.toggle'),c.sr.querySelectorAll('#stats .tile').length);
 c=tm(900); c.sr.querySelector('.toggle').click(); ok('thermomix: cut while heating needs 2 clicks',c.h.calls.length===0);
 c.sr.querySelector('.toggle').click(); ok('thermomix: 2nd click cuts',c.h.calls.length===1,JSON.stringify(c.h.calls));
 c=tm(3); c.sr.querySelector('.toggle').click(); ok('thermomix: standby cut in one click',c.h.calls.length===1);}

// tv
c=card('tv',{entity:'switch.tv',power:'sensor.p'},[mk('switch.tv','on'),mk('sensor.p',85,W)]); ok('tv on',has(c,'st-screen_on')&&/Allumée/.test(c.txt()),c.wrap.className+' '+c.txt());
c=card('tv',{entity:'switch.tv',power:'sensor.p'},[mk('switch.tv','on'),mk('sensor.p',0.5,W)]); ok('tv standby',has(c,'st-standby')&&/Veille/.test(c.txt()),c.wrap.className);
c=card('tv',{entity:'switch.tv',power:'sensor.p'},[mk('switch.tv','off'),mk('sensor.p',0,W)]); ok('tv off',has(c,'st-off'),c.wrap.className);
c=card('tv',{entity:'media_player.tv'},[mk('media_player.tv','playing',{app_name:'Netflix'})]); ok('tv media_player playing + app',has(c,'st-screen_on')&&/Netflix/.test(c.txt()),c.txt());
c=card('tv',{entity:'media_player.tv'},[mk('media_player.tv','off')]); ok('tv media_player off',has(c,'st-off'),c.wrap.className);
// vidéoprojecteurs (model)
{const PJ=(st,cfg={},a={},more=[])=>card('tv',{entity:'media_player.pj',model:'projector',...cfg},[mk('media_player.pj',st,{source:'HDMI 1',source_list:['HDMI 1','HDMI 2'],volume_level:0.4,supported_features:1|4|8|128|256|1024|2048|16384,...a}),...more]);
 let c=PJ('on'); ok('projector photo + beam',!!c.sr.querySelector('.pj image.pj-photo')&&!!c.sr.querySelector('.pj-beam')&&!c.sr.querySelector('.tv-content'));
 ok('projector on',has(c,'st-screen_on'),c.wrap.className);
 ok('projector buttons (power, source, vol, play, mute)',c.sr.querySelectorAll('#modes .sp-btn').length===6,c.sr.querySelectorAll('#modes .sp-btn').length);
 ok('projector source + volume chips',/HDMI 1/.test(c.sr.getElementById('stats').textContent)&&/40 %/.test(c.sr.getElementById('stats').textContent),c.sr.getElementById('stats').textContent);
 c=PJ('on',{show_controls:false,show_source:false,show_volume:false}); ok('projector toggles off',!c.sr.querySelector('#modes .sp-btn')&&!/HDMI/.test(c.sr.getElementById('stats').textContent));
 c=PJ('on',{lamp_hours:'sensor.l',picture_mode:'select.pm',temperature:'sensor.t'},{},[mk('sensor.l',2340,{unit_of_measurement:'h'}),mk('select.pm','Cinéma'),mk('sensor.t',41,T)]);
 const tx=c.sr.getElementById('stats').textContent; ok('projector lamp / picture / temp chips',/2[\s ]?340 h/.test(tx)&&/Cinéma/.test(tx)&&/41/.test(tx),tx);
 c=PJ('on',{lamp_hours:'sensor.l',show_lamp:false},{},[mk('sensor.l',2340,{unit_of_measurement:'h'})]); ok('projector show_lamp false',!/2[\s ]?340/.test(c.sr.getElementById('stats').textContent));
 c=PJ('standby'); ok('projector standby',has(c,'st-standby'),c.wrap.className);
 const calls=[]; c=PJ('on'); c.h.callService=(d,s,data)=>calls.push([d,s,data]); c.el.hass={...c.h}; c.sr.querySelector('[data-sp="source"]').click();
 ok('projector next source',calls.some(([d,s,x])=>d==='media_player'&&s==='select_source'&&x.source==='HDMI 2'),JSON.stringify(calls));
 c=card('tv',{entity:'media_player.pj',model:'projector_compact'},[mk('media_player.pj','off')]); ok('compact projector off',has(c,'st-off')&&!!c.sr.querySelector('.pj-photo'));
 c=card('tv',{entity:'media_player.tv'},[mk('media_player.tv','on',{source:'HDMI 1',supported_features:128|256|2048,source_list:['a','b']})]); ok('plain tv: no buttons by default',!c.sr.querySelector('#modes .sp-btn')&&!/HDMI/.test(c.sr.getElementById('stats').textContent));

document.getElementById('sum').innerHTML=`<b class="${fails?'f':'p'}">${R.length-fails} / ${R.length} tests réussis</b> — fichier testé : <code>dist/ha-appliance-electromenager-cards.js</code>`;
document.getElementById('res').innerHTML=R.map(r=>`<tr><td class="${r.pass?'p':'f'}">${r.pass?'✔':'✘'}</td><td>${r.name}</td><td>${r.info||''}</td></tr>`).join('');
</script></body></html>
